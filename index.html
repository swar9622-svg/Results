<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام استعلام درجات الطلاب</title>
    <!-- خط Tajawal الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة XLSX لقراءة ملفات الأكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 550px;
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
        }
        .header p {
            margin: 8px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }
        .content {
            padding: 25px 20px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
            text-align: center;
        }
        .search-box input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
        }
        .search-box button {
            padding: 12px 24px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background-color: #1e3c72;
        }
        
        .unit-select-box {
            margin-bottom: 20px;
            text-align: right;
            display: none;
            background-color: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }
        .unit-select-box label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }
        .unit-select-box select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
            cursor: pointer;
        }

        /* تعديل منطقة معلومات الطالب ليكون رقم الفصل بجانب الكلمة على اليمين */
        .student-info {
            background-color: #f8fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border-right: 4px solid #2a5298;
            display: none;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { 
            color: #64748b; 
            font-weight: 500;
            white-space: nowrap;
            min-width: 75px;
        }
        .info-value { 
            color: #0f172a; 
            font-weight: 700;
        }

        .grades-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            display: none;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .grades-table th {
            background-color: #f1f5f9;
            color: #475569;
            padding: 12px 10px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .grades-table td {
            padding: 12px 10px;
            font-size: 16px;
            font-weight: 700; /* خط عريض وواضح لكلمات المعايير */
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            vertical-align: middle;
        }
        .grades-table tr:last-child td {
            border-bottom: none;
        }
        
        /* تصميم مربعات الدرجات وحجم الأرقام */
        .score-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 8px;
            min-width: 95px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        .score-badge.pass {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }
        .score-badge.fail {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        /* تكبير رقم الدرجة المستحقة */
        .score-num {
            font-size: 18px;
            font-weight: 800;
        }
        /* إبقاء /10 بحجم أصغر ناعم */
        .score-max {
            font-size: 12px;
            opacity: 0.75;
            font-weight: 500;
        }

        /* المجموع النهائي بخط أكبر وأوضح */
        .total-row {
            background-color: #f8fafc;
        }
        .total-row td:first-child {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
        }
        .total-row .score-num {
            font-size: 20px;
        }

        .error {
            background-color: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h2 id="mainTitle">إشعار درجات الطالب</h2>
        <p>قم بطلب الاستعلام بمدخل رقم السجل المدني</p>
    </div>
    
    <div class="content">
        <!-- خانة ادخال السجل المدني -->
        <div class="search-box">
            <input type="text" id="idInput" placeholder="أدخل رقم السجل المدني...">
            <button onclick="searchStudent(true)">بحث</button>
        </div>

        <!-- قائمة اختيار التنقل بين الوحدات -->
        <div id="unitSelectContainer" class="unit-select-box">
            <label for="unitSelect">عرض درجات وحدة أخرى:</label>
            <select id="unitSelect" onchange="displaySelectedUnit()"></select>
        </div>

        <div id="errorMsg" class="error">عفواً، لم يتم العثور على طالب بهذا السجل المدني.</div>

        <!-- معلومات الطالب الرئيسية -->
        <div id="studentInfo" class="student-info">
            <div class="info-row">
                <span class="info-label">اسم الطالب:</span>
                <span class="info-value" id="resName">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">الفصل:</span>
                <span class="info-value" id="resClass">-</span>
            </div>
        </div>

        <!-- جدول درجات المواد -->
        <table id="resultTable" class="grades-table">
            <thead>
                <tr>
                    <th>المعيار</th>
                    <th>الدرجة المستحقة</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>الواجبات</td><td id="resHw">-</td></tr>
                <tr><td>الأنشطة</td><td id="resAct">-</td></tr>
                <tr><td>المشاركة</td><td id="resPart">-</td></tr>
                <tr><td>الاختبار</td><td id="resExam">-</td></tr>
                <tr class="total-row">
                    <td>المجموع النهائي</td>
                    <td id="resTotal">-</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let workbookData = null;
    let currentStudentId = "";

    window.onload = function() {
        fetch('data.xlsx')
            .then(res => {
                if (!res.ok) throw new Error("File not found");
                return res.arrayBuffer();
            })
            .then(ab => {
                workbookData = XLSX.read(ab, {type: 'array'});
            })
            .catch(err => console.error("خطأ في تحميل الأكسل:", err));
    };

    function formatScoreBadge(score, maxScore) {
        const numScore = parseFloat(score) || 0;
        const halfScore = maxScore / 2;
        const statusClass = numScore < halfScore ? 'fail' : 'pass';
        
        return `<div class="score-badge ${statusClass}">
                    <span class="score-num">${numScore}</span>
                    <span class="score-max">/ ${maxScore}</span>
                </div>`;
    }

    function searchStudent(isNewSearch = false) {
        const inputVal = document.getElementById('idInput').value.trim();
        const unitSelect = document.getElementById('unitSelect');

        if (!inputVal || !workbookData) return;
        
        currentStudentId = inputVal;
        const sheetNames = workbookData.SheetNames;
        
        if (isNewSearch) {
            unitSelect.innerHTML = '';
            sheetNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                unitSelect.appendChild(opt);
            });
            
            unitSelect.value = sheetNames[sheetNames.length - 1];
        }

        displaySelectedUnit();
    }

    function displaySelectedUnit() {
        const selectedSheet = document.getElementById('unitSelect').value;
        const errorDiv = document.getElementById('errorMsg');
        const resultTable = document.getElementById('resultTable');
        const studentInfo = document.getElementById('studentInfo');
        const unitContainer = document.getElementById('unitSelectContainer');
        const mainTitle = document.getElementById('mainTitle');

        if (!selectedSheet || !currentStudentId) return;

        const sheet = workbookData.Sheets[selectedSheet];
        const studentsData = XLSX.utils.sheet_to_json(sheet, {raw: false, defval: ""});

        const student = studentsData.find(row => {
            const firstKey = Object.keys(row)[0];
            return String(row[firstKey]).trim() === currentStudentId;
        });

        if (student) {
            const keys = Object.keys(student);
            
            const subject = student[keys[3]] || '';
            const gradeLevel = student[keys[4]] || '';
            const unit = student[keys[5]] || selectedSheet;

            mainTitle.innerText = `إشعار درجات الطالب بمادة ${subject} للصف ${gradeLevel} للوحدة ${unit}`;

            document.getElementById('resName').innerText = student[keys[1]] || '-';
            document.getElementById('resClass').innerText = student[keys[2]] || '-';
            
            const hwVal = student[keys[6]] || 0;
            const actVal = student[keys[7]] || 0;
            const partVal = student[keys[8]] || 0;
            const examVal = student[keys[9]] || 0;
            const totalVal = student[keys[10]] || 0;

            document.getElementById('resHw').innerHTML = formatScoreBadge(hwVal, 10);
            document.getElementById('resAct').innerHTML = formatScoreBadge(actVal, 20);
            document.getElementById('resPart').innerHTML = formatScoreBadge(partVal, 10);
            document.getElementById('resExam').innerHTML = formatScoreBadge(examVal, 20);
            document.getElementById('resTotal').innerHTML = formatScoreBadge(totalVal, 60);

            errorDiv.style.display = 'none';
            studentInfo.style.display = 'block';
            resultTable.style.display = 'table';
            unitContainer.style.display = 'block';
        } else {
            studentInfo.style.display = 'none';
            resultTable.style.display = 'none';
            unitContainer.style.display = 'none';
            errorDiv.style.display = 'block';
            mainTitle.innerText = "إشعار درجات الطالب";
        }
    }
</script>

</body>
</html>
