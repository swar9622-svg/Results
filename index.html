<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام استعلام درجات الطلاب</title>
    <!-- خط Tajawal الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- مكتبة XLSX لقراءة ملفات الأكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 550px;
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
        }
        .header p {
            margin: 8px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }
        .content {
            padding: 25px 20px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
            text-align: center;
        }
        .search-box input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
        }
        .search-box button {
            padding: 12px 24px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background-color: #1e3c72;
        }
        .student-info {
            background-color: #f8fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border-right: 4px solid #2a5298;
            display: none;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: #64748b; font-weight: 500; }
        .info-value { color: #0f172a; font-weight: 700; }

        .grades-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            display: none;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .grades-table th {
            background-color: #f1f5f9;
            color: #475569;
            padding: 12px 10px;
            font-size: 14px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .grades-table td {
            padding: 12px 10px;
            font-size: 15px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }
        .grades-table tr:last-child td {
            border-bottom: none;
        }
        .total-row {
            background-color: #f0fdf4;
            font-weight: 700;
        }
        .total-row td {
            color: #15803d !important;
            font-size: 18px !important;
        }
        .error {
            background-color: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h2 id="mainTitle">إشعار درجات الطالب</h2>
        <p>قم بطلب الاستعلام بمدخل رقم السجل المدني</p>
    </div>
    
    <div class="content">
        <div class="search-box">
            <input type="text" id="idInput" placeholder="أدخل رقم السجل المدني...">
            <button onclick="searchStudent()">بحث</button>
        </div>

        <div id="errorMsg" class="error">عفواً، لم يتم العثور على طالب بهذا السجل المدني.</div>

        <!-- معلومات الطالب الرئيسية -->
        <div id="studentInfo" class="student-info">
            <div class="info-row">
                <span class="info-label">اسم الطالب:</span>
                <span class="info-value" id="resName">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">الفصل:</span>
                <span class="info-value" id="resClass">-</span>
            </div>
        </div>

        <!-- جدول درجات المواد -->
        <table id="resultTable" class="grades-table">
            <thead>
                <tr>
                    <th>المعيار</th>
                    <th>الدرجة</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>الواجبات</td><td id="resHw">-</td></tr>
                <tr><td>الأنشطة</td><td id="resAct">-</td></tr>
                <tr><td>المشاركة</td><td id="resPart">-</td></tr>
                <tr><td>الاختبار</td><td id="resExam">-</td></tr>
                <tr class="total-row">
                    <td>المجموع النهائي</td>
                    <td id="resTotal">-</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let studentsData = [];

    // تحميل ملف الاكسل
    window.onload = function() {
        fetch('data.xlsx')
            .then(res => {
                if (!res.ok) throw new Error("File not found");
                return res.arrayBuffer();
            })
            .then(ab => {
                const wb = XLSX.read(ab, {type: 'array'});
                const sheetName = wb.SheetNames[0];
                const sheet = wb.Sheets[sheetName];
                studentsData = XLSX.utils.sheet_to_json(sheet, {raw: false, defval: ""});
            })
            .catch(err => console.error("خطأ في التحميل:", err));
    };

    function searchStudent() {
        const inputVal = document.getElementById('idInput').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        const resultTable = document.getElementById('resultTable');
        const studentInfo = document.getElementById('studentInfo');
        const mainTitle = document.getElementById('mainTitle');

        if (!inputVal) return;

        const student = studentsData.find(row => {
            const firstKey = Object.keys(row)[0];
            return String(row[firstKey]).trim() === inputVal;
        });

        if (student) {
            const keys = Object.keys(student);
            
            // قراءة المادة، الصف، والوحدة ديناميكياً من شيت الأكسل
            const subject = student[keys[3]] || '';
            const gradeLevel = student[keys[4]] || '';
            const unit = student[keys[5]] || '';

            // تحديث العنوان الرئيسي
            mainTitle.innerText = `إشعار درجات الطالب بمادة ${subject} للصف ${gradeLevel} للوحدة ${unit}`;

            // تعبئة بيانات الطالب
            document.getElementById('resName').innerText = student[keys[1]] || '-';
            document.getElementById('resClass').innerText = student[keys[2]] || '-';
            
            // تعبئة الدرجات مع إضافة "من كذا"
            const hwVal = student[keys[6]] || '0';
            const actVal = student[keys[7]] || '0';
            const partVal = student[keys[8]] || '0';
            const examVal = student[keys[9]] || '0';
            const totalVal = student[keys[10]] || '0';

            document.getElementById('resHw').innerText = `${hwVal} من 10`;
            document.getElementById('resAct').innerText = `${actVal} من 20`;
            document.getElementById('resPart').innerText = `${partVal} من 10`;
            document.getElementById('resExam').innerText = `${examVal} من 20`;
            document.getElementById('resTotal').innerText = `${totalVal} من 60`;

            errorDiv.style.display = 'none';
            studentInfo.style.display = 'block';
            resultTable.style.display = 'table';
        } else {
            studentInfo.style.display = 'none';
            resultTable.style.display = 'none';
            errorDiv.style.display = 'block';
            mainTitle.innerText = "إشعار درجات الطالب";
        }
    }
</script>

</body>
</html>
